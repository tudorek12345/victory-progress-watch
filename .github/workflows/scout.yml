name: Scout

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: victory-scout-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: snapshot
        run: |
          node scripts/scout.mjs
          git add -- data/snapshot.json
          if git diff --cached --quiet -- data/snapshot.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update runtime snapshot' -- data/snapshot.json
          git push origin HEAD:refs/heads/main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
